<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arab szám - római szám</title>
  <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.24.1.css">
  <script src="https://code.jquery.com/qunit/qunit-2.24.1.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
    }

    .page {
      width: min(96vw, 60rem);
      margin: 0 auto;
    }

    main {
      width: min(100%, 34rem);
      box-sizing: border-box;
      margin: 0 auto;
      padding: 2rem;
      border: 1px solid #dfe4f0;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(37 51 83 / 12%);
    }

    h1 { margin-top: 0; }

    section {
      display: flow-root;
      box-sizing: border-box;
      width: 100%;
      margin-bottom: 1.5rem;
      padding: 1rem;
      border: 1px solid #dfe4f0;
      border-radius: 1rem;
      background: #fff;
    }

    section h2 {
      margin-top: 0;
      font-size: 1.15rem;
    }

    #qunit {
      position: static !important;
      display: block !important;
      min-height: 2rem;
      padding: 0 !important;
    }

    main {
      clear: both;
    }

    #qunit-tests {
      overflow: visible !important;
    }

    label, input, button { display: block; width: 100%; }

    label {
      margin-bottom: .5rem;
      font-weight: 650;
    }

    input, button {
      box-sizing: border-box;
      padding: .75rem 1rem;
      border-radius: .5rem;
      font: inherit;
    }

    input { border: 1px solid #aeb8ce; }
    input:focus-visible, button:focus-visible {
      outline: 3px solid #8fb5ff;
      outline-offset: 2px;
    }

    button {
      margin-top: 1rem;
      border: 0;
      color: #fff;
      background: #315dcc;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: #254aa9; }

    #result {
      min-height: 2.5rem;
      margin: 1.5rem 0 0;
      color: #315dcc;
      font-size: 2rem;
      font-weight: 750;
      text-align: center;
    }

    #error {
      min-height: 1.5rem;
      margin: .75rem 0 0;
      color: #b42318;
      text-align: center;
    }

    .hint {
      color: #59657d;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="test-panel" aria-labelledby="tests-title">
      <h2 id="tests-title">QUnit tesztek</h2>
      <div id="qunit"></div>
      <div id="qunit-fixture"></div>
    </section>
    <main>
      <h1>Arab szám → római szám</h1>
      <p class="hint">Adj meg egy egész számot 1 és 3999 között.</p>
      <form id="converter-form">
        <label for="arabic-number">Arab szám</label>
        <input id="arabic-number" name="arabic-number" type="number" min="1" max="3999" step="1" required>
        <button type="submit">Átalakítás</button>
      </form>
      <p id="error" role="alert" aria-live="polite"></p>
      <p id="result" aria-live="polite"></p>
    </main>
  </div>

  <script>
    "use strict";

    QUnit.module("Arab szám → római szám");

    QUnit.test("1 → I", (assert) => {
      assert.equal(convertArabicToRoman(1), "I");
    });

    QUnit.test("4 → IV", (assert) => {
      assert.equal(convertArabicToRoman(4), "IV");
    });

    QUnit.test("9 → IX", (assert) => {
      assert.equal(convertArabicToRoman(9), "IX");
    });

    QUnit.test("14 → XIV", (assert) => {
      assert.equal(convertArabicToRoman(14), "XIV");
    });

    QUnit.test("40 → XL", (assert) => {
      assert.equal(convertArabicToRoman(40), "XL");
    });

    QUnit.test("58 → LVIII", (assert) => {
      assert.equal(convertArabicToRoman(58), "LVIII");
    });

    QUnit.test("944 → CMXLIV", (assert) => {
      assert.equal(convertArabicToRoman(944), "CMXLIV");
    });

    QUnit.test("1994 → MCMXCIV", (assert) => {
      assert.equal(convertArabicToRoman(1994), "MCMXCIV");
    });

    QUnit.test("3999 → MMMCMXCIX", (assert) => {
      assert.equal(convertArabicToRoman(3999), "MMMCMXCIX");
    });

    QUnit.test("0 hibás bemenet", (assert) => {
      let hasError = false;
      try {
        convertArabicToRoman(0);
      } catch {
        hasError = true;
      }
      assert.equal(hasError, true);
    });

    QUnit.test("4000 hibás bemenet", (assert) => {
      let hasError = false;
      try {
        convertArabicToRoman(4000);
      } catch {
        hasError = true;
      }
      assert.equal(hasError, true);
    });

    function convertArabicToRoman(number) {
      if (!Number.isInteger(number) || number < 1 || number > 3999) {
        throw new Error("A számnak 1 és 3999 közötti egésznek kell lennie.");
      }

      const values = [
        [1000, "M"], [900, "CM"], [500, "D"], [400, "CD"],
        [100, "C"], [90, "XC"], [50, "L"], [40, "XL"],
        [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]
      ];
      let remainder = number;
      let roman = "";

      values.forEach(([value, symbol]) => {
        while (remainder >= value) {
          roman += symbol;
          remainder -= value;
        }
      });
      return roman;
    }

    const form = document.querySelector("#converter-form");
    const input = document.querySelector("#arabic-number");
    const result = document.querySelector("#result");
    const error = document.querySelector("#error");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      error.textContent = "";
      result.textContent = "";

      try {
        result.textContent = convertArabicToRoman(Number(input.value));
      } catch (conversionError) {
        error.textContent = conversionError.message;
      }
    });
  </script>
</body>
</html>
