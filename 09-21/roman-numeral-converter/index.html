<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arab szám - római szám</title>
  <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.24.1.css">
  <script src="https://code.jquery.com/qunit/qunit-2.24.1.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
    }

    .page {
      width: min(96vw, 60rem);
      margin: 0 auto;
    }

    main {
      width: min(100%, 34rem);
      box-sizing: border-box;
      margin: 0 auto;
      padding: 2rem;
      border: 1px solid #dfe4f0;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(37 51 83 / 12%);
    }

    h1 { margin-top: 0; }

    section {
      display: flow-root;
      box-sizing: border-box;
      width: 100%;
      margin-bottom: 1.5rem;
      padding: 1rem;
      border: 1px solid #dfe4f0;
      border-radius: 1rem;
      background: #fff;
    }

    section h2 {
      margin-top: 0;
      font-size: 1.15rem;
    }

    #qunit {
      position: static !important;
      display: block !important;
      min-height: 2rem;
      padding: 0 !important;
    }

    main {
      clear: both;
    }

    #qunit-tests {
      overflow: visible !important;
    }

    label, input, button { display: block; width: 100%; }

    label {
      margin-bottom: .5rem;
      font-weight: 650;
    }

    input, button {
      box-sizing: border-box;
      padding: .75rem 1rem;
      border-radius: .5rem;
      font: inherit;
    }

    input { border: 1px solid #aeb8ce; }
    input:focus-visible, button:focus-visible {
      outline: 3px solid #8fb5ff;
      outline-offset: 2px;
    }

    button {
      margin-top: 1rem;
      border: 0;
      color: #fff;
      background: #315dcc;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: #254aa9; }

    #result {
      min-height: 2.5rem;
      margin: 1.5rem 0 0;
      color: #315dcc;
      font-size: 2rem;
      font-weight: 750;
      text-align: center;
    }

    #error {
      min-height: 1.5rem;
      margin: .75rem 0 0;
      color: #b42318;
      text-align: center;
    }

    .hint {
      color: #59657d;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="test-panel" aria-labelledby="tests-title">
      <h2 id="tests-title">QUnit tesztek</h2>
      <div id="qunit"></div>
      <div id="qunit-fixture"></div>
    </section>
  </div>

  <script>
    "use strict";

    QUnit.module("Arab szám → római szám");

    QUnit.test("1 → I", (assert) => {
      assert.equal(convertArabicToRoman(1), "I");
    });

    function convertArabicToRoman(number) {
      return "I";
    }
  </script>
</body>
</html>
